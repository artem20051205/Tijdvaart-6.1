<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <filter id="hand"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="5" result="ruis"/><feDisplacementMap in="SourceGraphic" in2="ruis" scale="5"/></filter>
    <marker id="pijl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#d23b2a" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="80" y="70" font-size="40" fill="#222">Schets 2 – Varen</text>

  <g filter="url(#hand)" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="110" width="1440" height="720" rx="22"/>
    <!-- film -->
    <rect x="120" y="150" width="860" height="580" rx="16"/>
    <line x1="120" y1="150" x2="980" y2="730" stroke="#bbb"/>
    <line x1="980" y1="150" x2="120" y2="730" stroke="#bbb"/>
    <!-- bediening -->
    <circle cx="160" cy="780" r="32"/>
    <path d="M150 765 L176 780 L150 795 Z" fill="#222"/>
    <line x1="215" y1="780" x2="860" y2="780"/>
    <line x1="215" y1="780" x2="430" y2="780" stroke-width="9"/>
    <rect x="880" y="758" width="100" height="44" rx="22"/>
    <!-- kaart -->
    <rect x="1020" y="150" width="460" height="640" rx="16"/>
    <path d="M1290 760 C1280 650 1320 560 1280 470 C1240 380 1290 280 1250 190" stroke-dasharray="10 12"/>
    <path d="M1290 760 C1280 650 1320 560 1308 520" stroke-width="7"/>
    <rect x="1370" y="170" width="90" height="90" rx="10"/>
  </g>
  <!-- punten op de tijdlijn -->
  <g fill="#fbfaf6" stroke="#222" stroke-width="4">
    <circle cx="232" cy="780" r="11"/><circle cx="335" cy="780" r="11"/><circle cx="450" cy="780" r="11"/>
    <circle cx="560" cy="780" r="11"/><circle cx="612" cy="780" r="11"/><circle cx="745" cy="780" r="11"/>
  </g>
  <!-- punten op de kaart -->
  <g font-size="24" text-anchor="middle" fill="#222">
    <circle cx="1290" cy="730" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1290" y="739">1</text>
    <circle cx="1312" cy="630" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1312" y="639">2</text>
    <circle cx="1300" cy="530" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1300" y="539">3</text>
    <circle cx="1262" cy="430" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1262" y="439">4</text>
    <circle cx="1275" cy="330" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1275" y="339">5</text>
    <circle cx="1255" cy="225" r="24" fill="#fbfaf6" stroke="#222" stroke-width="4"/><text x="1255" y="234">6</text>
  </g>
  <circle cx="1308" cy="545" r="13" fill="#222"/>
  <text x="550" y="250" font-size="34" text-anchor="middle" fill="#888">FILM 1929</text>
  <text x="930" y="787" font-size="20" text-anchor="middle" fill="#222">Colofon</text>
  <text x="1415" y="222" font-size="18" text-anchor="middle" fill="#888">mini</text>

  <!-- notities -->
  <g fill="none" stroke="#d23b2a" stroke-width="3" marker-end="url(#pijl)">
    <path d="M1150 862 C1220 850 1280 760 1300 570"/>
    <path d="M1130 575 C1150 510 1190 460 1236 440"/>
    <path d="M420 865 C440 840 450 815 450 800"/>
  </g>
  <text x="980" y="888" font-size="26" fill="#d23b2a">de boot vaart mee op de kaart</text>
  <text x="1045" y="605" font-size="21" fill="#d23b2a">tik op een punt</text>
  <text x="1045" y="631" font-size="21" fill="#d23b2a">→ film gaat</text>
  <text x="1045" y="657" font-size="21" fill="#d23b2a">daarheen</text>
  <text x="200" y="888" font-size="26" fill="#d23b2a">tijdlijn met de 6 punten</text>
</svg>
